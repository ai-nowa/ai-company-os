# AI NOWA 動的設定ファイル
# 値を変更したら 5分以内に全 watcher に反映される（再起動不要）。
# 構造変更（新キー追加・型変更）は dynamic_config.py の _defaults() も更新する。

task_health:
  enabled: true
  stale_threshold_hours: 24
token_pace:
  alert_prompt_chars: 50000
external_check:
  enabled: true
  interval_seconds: 1800
  request_timeout: 10
architect_observer:
  enabled: true
  check_interval_seconds: 12600
  keyword_loop_threshold: 30
  silent_hours: 2
  token_overheat_threshold: 60000
  watched_keywords:
  - AdSense
  - Public
  - Private
  - 公開判断
  - 監査
  - 法務
  - ブロッカー
  - 撤退
  - Zenn
  - '404'
architect_outbox:
  dispatch_timeout_seconds: 900
admin_queue:
  enabled: false
  allowed_ops:
  - create_channel
  - create_invite
  - update_everyone_permission
  default_invite_max_age: 86400
  default_invite_max_uses: 1
outbox_organizer:
  enabled: false
  interval_seconds: 3600
auto_commit:
  enabled: false
  interval_seconds: 3600
dependency_visualizer:
  enabled: true
  interval_seconds: 3600
dashboard_writer:
  enabled: true
  interval_seconds: 900
self_improvement_loop:
  check_interval_seconds: 3600
  max_triggers_per_cycle: 2
mention_chain:
  max_depth: 4
  max_chain_calls: 6
  max_initial_targets: 6
  max_mentions_per_response: 2
  heartbeat_chain_calls: 1
model_policy:
  enabled: true
  ceo_always_xhigh: true
  high_judgment_employees:
  - saegusa_mio
  - shirase_kai
  - asakura_noa
  - kuroba_yuu
  - kagura_aoi
  creative_high_employees:
  - hoshino_ritsu
  - morinaga_haru
  - hinata_nagi
  models:
    codex:
      ceo: gpt-5.5
      default: gpt-5.5
    claude:
      default: sonnet
      micro: sonnet
      executive: opus
  fallbacks:
    claude:
      opus: sonnet
      sonnet: haiku
      haiku:
  efforts:
    codex:
      micro: low
      routine: medium
      judgment_routine: high
      business_routine: high
      creative_routine: high
      conversation: high
      deep_work: high
      risk_review: xhigh
      executive: xhigh
      crisis: xhigh
    claude:
      micro: low
      routine: medium
      judgment_routine: high
      business_routine: high
      creative_routine: high
      conversation: high
      deep_work: high
      risk_review: xhigh
      executive: xhigh
      crisis: max
  max_output_tokens:
    micro: 700
    routine: 1600
    work: 6000
    executive: 6000
  keywords:
    decision:
    - 公開可否
    - 公開する
    - リリース
    - 投資判断
    - 最終承認
    - 炎上
    - 監査判定
    - 重要判断
    - P0
    - '[important]'
    - '[critical]'
    - 本番投入
    - 契約
    - 支出
    - 違反
    - 価格
    - 撤退
    - 採用
    crisis:
    - 障害
    - 停止
    - 流出
    - 炎上
    - 返金
    - 法務
    - 契約解除
    - 重大
    - critical
    - '[critical]'
    - p0
    - security
    - incident
    risk:
    - 権限
    - 認証
    - OAuth
    - APIキー
